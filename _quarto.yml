project:
  title: "JAX-IDEM"
  type: website
  output-dir: docs

metadata-files:
  - reference/_sidebar.yml


bibliography: site/Bibliography.bib

execute:
  python: ".venv/bin/python"
  external: true

format:
  html:
    css:
      - reference/_styles-quartodoc.css
    theme:
      - _extensions/catppuccin/mocha.scss



website:
  reader-mode: true
  title: "Integro-Difference Equation Models in Python-JAX"
  navbar:
    left:
      - text: "Home"
        href: ./index.qmd
      - text: "The Maths"
        href: ./site/mathematics.qmd
      - text: "Docs"
        href: ./reference/index.qmd
      - text: "Examples"
        href: ./site/examples.qmd
    tools:
      - icon: github
        menu:
          - text: "Source"
            href: https://github.com/tatephughes/JAX-IDEM
          - text: "Issues"
            href: https://github.com/tatephughes/JAX-IDEM/issues


lightbox: true

toc: true
number-sections: true

quartodoc:
  package: jaxidem
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css
  sections:
    - title: Filtering and Smoothing Functions
      package: jaxidem.filters
      desc: Functions to apply Kalman/information filters, smoothers and so on.
      contents:
        - ql_L
        - kalman_filter
    - title: Integro-Difference Models in JAX
      package: jaxidem.idem
      desc: Classes and functions to perform simulation, fitting, filtering and prediction on IDEMs.
      contents:
        - Kernel
        - param_exp_kernel
        - IdemParams
    - title: Utilties
      package: jaxidem.utils
      desc: General classes and functions used to supplement the main package
      contents:
        - Grid
        - outer_op

